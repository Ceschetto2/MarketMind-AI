[project]
name = "marketmind-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Francesco", email = "francesco.bocci09@gmail.com" }
]
requires-python = "==3.14.*"
dependencies = [
    "alembic>=1.19.1",
    "google-genai>=2.23.0",
    "plotly<6",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.63.0",
    "tenacity>=9.1.4",
    "vectorbt>=1.1.0",
    "yfinance>=1.7.0",
]

[project.scripts]
marketmind-ai = "marketmind_ai:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.alembic]
# Config di Alembic (>=1.16 supporta [tool.alembic] in pyproject.toml al
# posto di alembic.ini, che infatti non esiste più in questo repo — vedi
# alembic/env.py per la parte che l'ini gestiva altrimenti, cioè logging e
# sqlalchemy.url: quest'ultima non è mai qui perché env.py la calcola
# sempre da marketmind_ai.config.get_database_url(), mai da file statico.
script_location = "alembic"
prepend_sys_path = ["."]
version_path_separator = "os"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `integration` richiede Postgres reale raggiungibile (marketmind-db, via
# .env) — coerente con la prassi già in uso nel progetto di verificare
# schema/scritture contro l'istanza vera, non un mock. `unit` non tocca
# né DB né rete: fonti dati esterne (yfinance, ecc.) sono mockate.
markers = [
    "integration: richiede Postgres reale raggiungibile (marketmind-db)",
]

[project]
name = "marketmind"
version = "0.1.0"
description = "AI Market Mind — root del workspace uv (non pubblicato come pacchetto)."
readme = "README.md"
authors = [
    { name = "Francesco", email = "francesco.bocci09@gmail.com" }
]
requires-python = "==3.14.*"
# La root non è un pacchetto installabile (`package = false`): dipende da
# tutti i membri del workspace solo perché `uv sync` in sviluppo installi
# l'intero progetto in un unico `.venv`, test e Alembic compresi. Ogni
# immagine invece installa solo il proprio pacchetto e le sue dipendenze
# (`uv sync --package <nome>`), non questa lista.
dependencies = [
    "marketmind-common",
    "marketmind-db",
    "marketmind-pipelines",
    "marketmind-llm-decision-engine",
    "marketmind-frontend",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
marketmind-common = { workspace = true }
marketmind-db = { workspace = true }
marketmind-pipelines = { workspace = true }
marketmind-llm-decision-engine = { workspace = true }
marketmind-frontend = { workspace = true }

[tool.alembic]
# Config di Alembic (>=1.16 supporta [tool.alembic] in pyproject.toml al
# posto di alembic.ini, che infatti non esiste più in questo repo — vedi
# deploy/alembic/env.py per la parte che l'ini gestiva altrimenti, cioè
# logging e sqlalchemy.url: quest'ultima non è mai qui perché env.py la
# calcola sempre da marketmind_common.config.get_database_url(), mai da
# file statico.
script_location = "deploy/alembic"
prepend_sys_path = ["."]
version_path_separator = "os"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `integration` richiede Postgres reale raggiungibile (marketmind-db, via
# .env) — coerente con la prassi già in uso nel progetto di verificare
# schema/scritture contro l'istanza vera, non un mock. `unit` non tocca
# né DB né rete: fonti dati esterne (yfinance, ecc.) sono mockate.
markers = [
    "integration: richiede Postgres reale raggiungibile (marketmind-db)",
]

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# L'URL reale viene iniettato da alembic/env.py via
# marketmind_ai.config.get_database_url() (legge .env / POSTGRES_*).
# Questo valore è solo un placeholder per chi apre il file.
sqlalchemy.url = postgresql+psycopg://marketmind:marketmind@localhost:5432/marketmind

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[project]
name = "marketmind-frontend"
version = "0.1.0"
description = "Dashboard Streamlit in sola lettura sui portfolio."
requires-python = "==3.14.*"
dependencies = [
    "marketmind-common",
    "marketmind-db",
    "pandas",
    "plotly<6",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.63.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
marketmind-common = { workspace = true }
marketmind-db = { workspace = true }

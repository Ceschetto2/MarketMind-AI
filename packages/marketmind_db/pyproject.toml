[project]
name = "marketmind-db"
version = "0.1.0"
description = "Connessione a Postgres+TimescaleDB, modelli ORM e strato generico di lettura/scrittura."
requires-python = "==3.14.*"
dependencies = [
    "marketmind-common",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.52",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
marketmind-common = { workspace = true }

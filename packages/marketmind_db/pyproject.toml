[project]
name = "marketmind-db"
version = "0.1.0"
description = "Connessione a Postgres+TimescaleDB, modelli ORM e strato generico di lettura/scrittura."
requires-python = "==3.14.*"
dependencies = [
    "marketmind-common",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.52",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

# Il codice sta direttamente in `src/`, senza la cartella `src/marketmind_db/`
# in mezzo: `package-dir` fa corrispondere il nome di import `marketmind_db` a
# `src/`. Va elencato ogni sottopacchetto (una cartella con `__init__.py`),
# perché l'auto-discovery di setuptools ricaverebbe i nomi dalle cartelle
# (`src.models`), non dal nome di import.
[tool.setuptools]
package-dir = { "marketmind_db" = "src" }
packages = [
    "marketmind_db",
    "marketmind_db.models",
]

[tool.uv.sources]
marketmind-common = { workspace = true }

[project]
name = "marketmind-pipelines"
version = "0.1.0"
description = "Pipeline di ingestion delle fonti dati di mercato."
requires-python = "==3.14.*"
dependencies = [
    "marketmind-common",
    "marketmind-db",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "tenacity>=9.1.4",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
marketmind-common = { workspace = true }
marketmind-db = { workspace = true }
